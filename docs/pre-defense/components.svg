<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#457534"/></marker></defs><rect width="1200" height="900" fill="#fafbf7"/><g font-family="Arial,sans-serif" fill="#363636"><text x="35" y="45" font-size="27">PantryPlan components</text><text x="35" y="75" font-size="15">Implemented browser flow; reference tests and future backend are separated</text><rect x="35" y="125" width="235" height="78" rx="7" fill="white" stroke="#7d8285"/><text x="152.5" y="154" text-anchor="middle" font-size="18">Static host</text><text x="152.5" y="179" text-anchor="middle" font-size="14">HTML / CSS / JS / JSON</text><rect x="340" y="125" width="260" height="78" rx="7" fill="white" stroke="#7d8285"/><text x="470.0" y="154" text-anchor="middle" font-size="18">app.js + HTML / CSS</text><text x="470.0" y="179" text-anchor="middle" font-size="14">UI events, rendering, persistence</text><rect x="700" y="100" width="370" height="75" rx="7" fill="white" stroke="#7d8285"/><text x="885.0" y="129" text-anchor="middle" font-size="18">model.js</text><text x="885.0" y="154" text-anchor="middle" font-size="14">Week records, validation, moves</text><rect x="700" y="225" width="370" height="75" rx="7" fill="white" stroke="#7d8285"/><text x="885.0" y="254" text-anchor="middle" font-size="18">engine.js</text><text x="885.0" y="279" text-anchor="middle" font-size="14">Eligibility, TF-IDF, plans, groceries</text><rect x="340" y="350" width="260" height="75" rx="7" fill="white" stroke="#7d8285"/><text x="470.0" y="379" text-anchor="middle" font-size="18">localStorage</text><text x="470.0" y="404" text-anchor="middle" font-size="14">Origin-specific browser state</text><rect x="700" y="350" width="370" height="75" rx="7" fill="white" stroke="#7d8285"/><text x="885.0" y="379" text-anchor="middle" font-size="18">catalog.json</text><text x="885.0" y="404" text-anchor="middle" font-size="14">18 example recipes, 30 products</text><rect x="35" y="520" width="300" height="78" rx="7" fill="white" stroke="#7d8285"/><text x="185.0" y="549" text-anchor="middle" font-size="18">serve.py → recommender.py</text><text x="185.0" y="574" text-anchor="middle" font-size="14">Optional loopback reference API</text><rect x="400" y="520" width="300" height="78" rx="7" fill="white" stroke="#7d8285"/><text x="550.0" y="549" text-anchor="middle" font-size="18">Automated tests</text><text x="550.0" y="574" text-anchor="middle" font-size="14">State, domain and JS/Python parity</text><g fill="none" stroke="#457534" stroke-width="2" marker-end="url(#a)"><path d="M270 164H340"/><path d="M600 145H700"/><path d="M600 180L700 250"/><path d="M885 175V225"/><path d="M470 203V350"/><path d="M340 385H310V195H340"/><path d="M600 185L700 375"/><path d="M185 520V440H740V425"/><path d="M550 520V500H1140V265H1070" stroke-dasharray="7 5"/><path d="M600 520V485H1120V140H1070" stroke-dasharray="7 5"/><path d="M400 560H335" stroke-dasharray="7 5"/></g><text x="35" y="470" font-size="15">Optional local reference is NOT called by the browser; parity tests compare implementations</text><rect x="35" y="655" width="1130" height="190" rx="8" fill="#f2f2ef" stroke="#7d8285" stroke-dasharray="8 5"/><text x="60" y="689" font-size="19">Proposed next architecture — NOT implemented</text><rect x="60" y="725" width="270" height="78" rx="7" fill="white" stroke="#7d8285"/><text x="195.0" y="754" text-anchor="middle" font-size="18">Web / later mobile</text><text x="195.0" y="779" text-anchor="middle" font-size="14">API clients</text><rect x="430" y="725" width="300" height="78" rx="7" fill="white" stroke="#7d8285"/><text x="580.0" y="754" text-anchor="middle" font-size="18">Python modular API</text><text x="580.0" y="779" text-anchor="middle" font-size="14">Accounts, plans, recommendations</text><rect x="850" y="725" width="285" height="78" rx="7" fill="white" stroke="#7d8285"/><text x="992.5" y="754" text-anchor="middle" font-size="18">Relational store</text><text x="992.5" y="779" text-anchor="middle" font-size="14">User-owned records</text><g stroke="#457534" stroke-width="2" marker-end="url(#a)"><path d="M330 760H430"/><path d="M730 760H850"/></g><text x="60" y="830" font-size="14">Controlled permitted-data preparation and evaluation feed the future store.</text></g></svg>
